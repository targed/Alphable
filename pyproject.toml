[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alphable"
version = "0.4.0"
description = "Alphable: Championship-tier Scrabble AI with MAGPIE, BAMS, and Cross-Attention Value Networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
alphable = "alphable.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alphable*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["vendor", "data", ".git", ".pytest_cache", "visualizer/frontend/node_modules"]
markers = [
    "unit: fast unit tests for isolated modules",
    "e2e: end-to-end integration and workflow tests",
    "audit: statistical and parameter ceiling audit verification",
    "benchmark: tournament simulation and performance benchmarks",
]

