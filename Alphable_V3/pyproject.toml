[build-system]
requires = ["setuptools>=42", "wheel", "Cython", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "alphable"
version = "0.1.0"
description = "Alphable V3: Scrabble RL Engine"
authors = [
    { name = "Alphable" }
]
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "Cython",
    "tqdm"
]

[project.scripts]
alphable = "alphable.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest"
]
